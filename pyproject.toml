[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md_chunking"
version = "0.1.0"
description = "Chunking de documents Markdown avec sortie JSON et rendu de relecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "haystack-ai>=2.10,<3.0",
    "markdown-it-py>=3.0,<4.0",
]

[project.scripts]
md_chunking = "md_chunking.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["md_chunking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
